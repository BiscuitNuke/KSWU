name: kswu

services:
  web:
    # CI replaces this only after a successful main-branch build and smoke check.
    image: ghcr.io/biscuitnuke/kswu:sha-9bf3daeb7531bbde1cb11eea4fb6c3356cb22d9b-45255715202-1
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    ports:
      # Set to the host's private LAN address for Caddy. Firewall allows gateway only.
      - "${KSWU_BIND_IP:-127.0.0.1}:${KSWU_PORT:-8088}:8080"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
