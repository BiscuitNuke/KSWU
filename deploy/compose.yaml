name: kswu

services:
  web:
    # CI replaces this only after a successful main-branch build and smoke check.
    image: &image ghcr.io/biscuitnuke/kswu:sha-b083176202e1f144bb39cf83be782ca7a1079253-45506640720-1
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 128m
    volumes:
      - live:/live:ro
    ports:
      # Set to the host's private LAN address for Caddy. Firewall allows gateway only.
      - "${KSWU_BIND_IP:-127.0.0.1}:${KSWU_PORT:-8088}:8080"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Reads Prometheus and the Flight Wall on the home network every 2 minutes and
  # writes /live/live.json for the site. Pull only; nothing in the lab is exposed.
  # Leave PROM_URL / FLIGHTWALL_URL empty to turn a section off.
  feed:
    image: *image
    restart: unless-stopped
    user: "101:101"
    read_only: true
    entrypoint: ["python3", "-u", "/feed/feed.py"]
    command: []
    healthcheck:
      disable: true
    environment:
      PROM_URL: "${KSWU_PROM_URL:-}"
      JOB_LABELS: "${KSWU_JOB_LABELS:-}"
      FLIGHTWALL_URL: "${KSWU_FLIGHTWALL_URL:-}"
      INTERVAL: "120"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - live:/live
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 50
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  live:
