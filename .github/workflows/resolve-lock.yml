name: Resolve portfolio dependency lock
on:
  push:
    branches: [codex/kswu-professional-portfolio]
    paths: ['package.json', '.github/workflows/resolve-lock.yml']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export public lockfile for review
        run: |
          node -e 'const fs=require("fs"); console.log("LOCKFILE_START"); console.log(fs.readFileSync("package-lock.json").toString("base64")); console.log("LOCKFILE_END");'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
